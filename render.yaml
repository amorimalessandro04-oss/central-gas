# Central Gás — infraestrutura R$0
# Render hospeda apenas o backend e o frontend. O PostgreSQL fica no Supabase Free.
services:
  - type: web
    name: central-gas-api
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CENTRAL_GAS_DB_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Gerente
      - key: CORS_ORIGINS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: GERENTE_WHATSAPP
        sync: false

  - type: web
    name: central-gas-site
    runtime: static
    buildCommand: npm ci && npm run build
    rootDir: frontend
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "24.21.0"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
