# Blueprint de produção. Selecione este caminho no Render; aplicar cria/atualiza
# recursos pagos (API e PostgreSQL), portanto revise o custo antes de implantar.
services:
  - type: web
    name: central-gas-api
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DB_HOST
        fromDatabase:
          name: central-gas-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: central-gas-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: central-gas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: central-gas-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: central-gas-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Gerente
      - key: CORS_ORIGINS
        value: https://central-gas-site.onrender.com
      - key: DB_SSL
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: GERENTE_WHATSAPP
        sync: false

  - type: web
    name: central-gas-site
    runtime: static
    buildCommand: npm ci && npm run build
    rootDir: frontend
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: VITE_API_URL
        value: https://central-gas-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: central-gas-db
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "18"
    databaseName: central_gas_db
    user: central_gas_db_user
    diskSizeGB: 1
